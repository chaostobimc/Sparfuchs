name: sparschwein
description: Sparschwein – Sparübersicht für Android und Windows.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  connectivity_plus: ^6.1.4
  flutter_secure_storage: ^9.2.4
  http: ^1.4.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 700
    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/CormorantGaramond-Variable.ttf
          weight: 400
        - asset: assets/fonts/CormorantGaramond-Variable.ttf
          weight: 600
